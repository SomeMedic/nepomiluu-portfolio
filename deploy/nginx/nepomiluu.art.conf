# Host Nginx (Ubuntu 22.04 / nginx 1.18+). Certbot uses the shared webroot.
limit_req_zone $binary_remote_addr zone=nepomiluu_login:1m rate=6r/m;
server {
    listen 80;
    listen [::]:80;
    server_name nepomiluu.art;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://nepomiluu.art$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nepomiluu.art;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nepomiluu.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepomiluu.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nepomiluu_tls:1m;
    ssl_session_timeout 1d;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /.well-known/deployment.json {
        alias /var/lib/nepomiluu/deployment.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/internal/ { return 404; }
    location = /api/admin/login {
        limit_req zone=nepomiluu_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
