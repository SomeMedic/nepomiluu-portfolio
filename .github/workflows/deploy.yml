name: Verify and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  # Cancelling an observer never interrupts the independent server deployment.
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/prepare-social-assets.mjs --check
      - run: node --test scripts/operations.test.mjs scripts/local-runtime.test.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    environment:
      name: production
      url: https://nepomiluu.art
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Git must see the previous deploy-ready commit to advance it safely.
          fetch-depth: 0
      - name: Mark this verified main revision ready for server deployment
        run: git push origin HEAD:refs/heads/deploy-ready
      - name: Wait for the server to finish deployment and HTTPS checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            version=$(curl --fail --silent --max-time 15 https://nepomiluu.art/.well-known/deployment.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [[ "$version" == "$GITHUB_SHA" ]]; then
              echo "Production is serving $GITHUB_SHA over trusted HTTPS."
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not acknowledge this revision in time.' >&2
          exit 1
